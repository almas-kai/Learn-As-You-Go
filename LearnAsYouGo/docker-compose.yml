services:
  postgres:
    image: postgres:17-alpine
    container_name: learnasyougo-postgres
    environment:
      POSTGRES_DB: LearnAsYouGo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourPassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LearnAsYouGo"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: learnasyougo-mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI — http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
