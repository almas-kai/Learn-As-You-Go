services:
  postgres:
    image: postgres:17-alpine
    container_name: learnasyougo-postgres
    environment:
      POSTGRES_DB: LearnAsYouGoMainDB
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d LearnAsYouGoMainDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-logs:
    image: postgres:17-alpine
    container_name: learnasyougo-postgres-logs
    environment:
      POSTGRES_DB: LearnAsYouGoLogsDB
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_logs_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d LearnAsYouGoLogsDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: learnasyougo-mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI — http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  postgres_logs_data:
